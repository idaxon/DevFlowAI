<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DevFlow AI - DevOps Platform{% endblock %}</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 & FontAwesome 6 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Chart.js & Markdown Renderer -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>

  <!-- DevFlow Clean SaaS CSS -->
  <link rel="stylesheet" href="{{ url_prefix|default('') }}/static/css/style.css?v=2.5">
  {% block extra_head %}{% endblock %}
</head>
<body>

  <div class="app-layout">
    
    <!-- Left Fixed Sidebar -->
    <aside class="sidebar">
      <!-- Brand Logo -->
      <a href="/" class="sidebar-brand">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <line x1="6" y1="19" x2="10" y2="5" stroke="#10b981" stroke-width="3.5" stroke-linecap="round"/>
            <line x1="14" y1="19" x2="18" y2="5" stroke="#10b981" stroke-width="3.5" stroke-linecap="round"/>
            <circle cx="19" cy="18" r="2" fill="#10b981"/>
          </svg>
        </div>
        <span class="brand-text">DevFlow AI</span>
      </a>

      <!-- Navigation Links -->
      <nav class="sidebar-nav">
        <a href="/" class="sidebar-link {% if request.path == '/' %}active{% endif %}">
          <i class="fa-solid fa-house"></i>
          <span>Dashboard</span>
        </a>
        <a href="/repositories" class="sidebar-link {% if '/repositories' in request.path %}active{% endif %}">
          <i class="fa-regular fa-folder"></i>
          <span>Repositories</span>
        </a>
        <a href="/workflows" class="sidebar-link {% if '/workflows' in request.path %}active{% endif %}">
          <i class="fa-solid fa-play" style="font-size: 0.8rem;"></i>
          <span>Workflows</span>
        </a>
        <a href="/troubleshoot" class="sidebar-link {% if '/troubleshoot' in request.path %}active{% endif %}">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span>Troubleshooter</span>
        </a>
        <a href="/agents" class="sidebar-link {% if '/agents' in request.path %}active{% endif %}">
          <i class="fa-solid fa-robot"></i>
          <span>Agents</span>
        </a>
        <a href="/deployments" class="sidebar-link {% if '/deployments' in request.path %}active{% endif %}">
          <i class="fa-solid fa-cube"></i>
          <span>Deployments</span>
        </a>
        <a href="/logs" class="sidebar-link {% if '/logs' in request.path %}active{% endif %}">
          <i class="fa-regular fa-file-lines"></i>
          <span>Logs</span>
        </a>
        <a href="/analytics" class="sidebar-link {% if '/analytics' in request.path %}active{% endif %}">
          <i class="fa-solid fa-chart-simple"></i>
          <span>Analytics</span>
        </a>
      </nav>

      <!-- Sidebar Footer Actions -->
      <div class="sidebar-footer">
        <a href="/settings" class="sidebar-link {% if '/settings' in request.path %}active{% endif %}">
          <i class="fa-solid fa-gear"></i>
          <span>Settings</span>
        </a>
        <a href="https://github.com" target="_blank" class="sidebar-link">
          <i class="fa-regular fa-book-open"></i>
          <span>Documentation</span>
        </a>

        <!-- User Profile Pill -->
        <div class="user-profile-pill">
          <div class="d-flex align-items-center gap-2">
            <div class="user-avatar-circle">D</div>
            <div class="user-info">
              <span class="user-name">Daksh Mishra</span>
              <span class="user-role">Developer</span>
            </div>
          </div>
          <i class="fa-solid fa-chevron-right text-muted" style="font-size: 0.7rem;"></i>
        </div>
      </div>
    </aside>

    <!-- Main Workspace Area -->
    <div class="main-wrapper">
      
      <!-- Top Right Header Navigation -->
      <header class="top-header">
        <button class="top-icon-btn" title="Toggle Theme">
          <i class="fa-regular fa-sun"></i>
        </button>

        {% if demo_mode %}
        <div class="top-pill">
          <i class="fa-solid fa-plus-minus text-muted" style="font-size: 0.75rem;"></i>
          <span>Demo Mode</span>
        </div>
        {% endif %}

        <div class="top-pill operational">
          <span class="pulse-dot"></span>
          <span>Operational</span>
        </div>
      </header>

      <!-- Page Content -->
      <main class="page-container">
        {% block content %}{% endblock %}
      </main>

    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
